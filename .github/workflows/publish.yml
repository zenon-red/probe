name: Publish Package

on:
  push:
    tags:
      - "@zenon-red/probe@*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: npm ci

      - name: Verify publish checks
        run: npm run prepublishOnly

      - name: Publish to NPM
        run: npx npm@latest publish --provenance --access public
